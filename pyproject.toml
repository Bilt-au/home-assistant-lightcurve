[tool.pytest.ini_options]
# pytest-homeassistant-custom-component's fixtures are async generators, so the
# auto asyncio mode is not optional — without it every fixture arrives unresolved.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `python -m pytest` puts the working directory on sys.path; bare `pytest` does not,
# so without this the suite passes locally and fails in CI with "No module named
# custom_components". Pinning it here makes both invocations behave the same.
pythonpath = ["."]
norecursedirs = ["spike", ".venv"]
filterwarnings = [
    # Testing against the exact production Home Assistant is pointless if its
    # deprecation warnings are hidden, so they fail the suite instead.
    "error::DeprecationWarning:homeassistant.*",
    "error:.*is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
