name: Release

# HACS surfaces updates from GitHub Releases. Without a release it installs from the
# default branch and never reports a new version, so Home Assistant's update entity
# stays silent. Tagging is therefore the whole update mechanism.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: the tag and the manifest version must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/lightcurve/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST."
            echo "::error::Home Assistant reports the manifest version and HACS reports the tag,"
            echo "::error::so a mismatch shows users two different version numbers."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: the shipped panel must match its source
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../custom_components/lightcurve/frontend || {
            echo "::error::The committed panel bundle is stale. Run 'npm run build' in frontend/ and commit it."
            exit 1
          }

      - name: create the release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
