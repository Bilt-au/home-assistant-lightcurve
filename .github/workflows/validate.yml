name: Validate

# hassfest and the HACS action are what a HACS listing is judged on, so they run on
# every push rather than only before a release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both actions validate against current Home Assistant, so a weekly run catches
    # upstream changes that break this integration without anyone touching it.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.9 requires >=3.14.2; anything older silently
          # resolves to an ancient HA and the suite stops meaning anything.
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check custom_components/ tests/
      - run: pytest -q
